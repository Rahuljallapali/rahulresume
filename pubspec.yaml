name: rahul_resume
description: "Rahul Jallapalli — portfolio. Flutter web, single-page, no backend."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Typography. Fonts are also preconnected in web/index.html so the first
  # paint does not wait on a cold DNS lookup.
  # 6.3.x reads Flutter's AssetManifest.bin. 6.2.x read AssetManifest.json,
  # which Flutter no longer generates — every font load threw on startup.
  google_fonts: ^6.3.3

  # State. Two small ChangeNotifiers (theme, project filter) — Provider is the
  # right size for this. GetX was dropped along with the multi-page router.
  provider: ^6.1.2

  url_launcher: ^6.3.1

  # Theme persistence across sessions (localStorage on web).
  shared_preferences: ^2.3.3

  # Brand marks (GitHub, LinkedIn) that Material icons do not ship.
  font_awesome_flutter: ^10.8.0

  # Resume PDF is generated from the same profile.dart the site renders, so the
  # document can never drift from the page.
  pdf: ^3.11.1

  # Contact form transport. Public key only — see services/email_service.dart.
  emailjs: ^4.0.0

  # Typed DOM interop for the client-side PDF download. Replaces `dart:html`,
  # which is deprecated and blocks Wasm compilation.
  web: ^1.1.0

  # Live GitHub contribution data. One unauthenticated GET on a CORS-enabled
  # endpoint — see services/github_service.dart for the failure policy.
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
