# Static analysis configuration.
#
# Stricter than the Flutter default on purpose: this repository is itself a
# work sample, so the lint set should reflect how the author configures a real
# project rather than what `flutter create` emits.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Surface implicit-dynamic and unsafe-variance style problems as errors
    # rather than letting them pass silently.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # An unused import or dead field is a defect in review, not a suggestion.
    unused_import: error
    unused_local_variable: error
    unused_field: error
    dead_code: error
    # Missing a required await is almost always a real bug.
    unawaited_futures: error

  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # Correctness
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - throw_in_finally
    - unnecessary_statements
    - use_build_context_synchronously

    # API surface
    - avoid_positional_boolean_parameters
    - prefer_final_fields
    - prefer_final_locals
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables

    # Readability
    - avoid_redundant_argument_values
    - directives_ordering
    - prefer_single_quotes
    # `require_trailing_commas` is deliberately omitted: it disagrees with the
    # formatter's own line-breaking, so `dart format` is the single authority
    # on layout here rather than having two tools fight.
    - sort_child_properties_last
    - unnecessary_parenthesis

    # Flutter specifics
    - sized_box_for_whitespace
    - use_colored_box
    - use_decorated_box
    - use_full_hex_values_for_flutter_colors
